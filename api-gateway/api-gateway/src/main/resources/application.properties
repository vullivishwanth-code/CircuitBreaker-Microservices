spring.application.name=api-gateway

server.port=8080

# ==========================================
# EUREKA
# ==========================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


# ==========================================
# ACTUATOR
# ==========================================

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always


# ==========================================
# IMPORTANT
# ==========================================
# Gateway routes are defined in
# ApiGatewayApplication.java.
#
# Do NOT define the same routes again here.


# ==========================================
# PRODUCT CIRCUIT BREAKER
# ==========================================

resilience4j.circuitbreaker.instances.productGatewayCircuitBreaker.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.productGatewayCircuitBreaker.sliding-window-size=5
resilience4j.circuitbreaker.instances.productGatewayCircuitBreaker.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.productGatewayCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.productGatewayCircuitBreaker.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.productGatewayCircuitBreaker.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.productGatewayCircuitBreaker.automatic-transition-from-open-to-half-open-enabled=true


# ==========================================
# INVENTORY CIRCUIT BREAKER
# ==========================================

resilience4j.circuitbreaker.instances.inventoryCircuitBreaker.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.inventoryCircuitBreaker.sliding-window-size=5
resilience4j.circuitbreaker.instances.inventoryCircuitBreaker.minimum-number-of-calls=2
resilience4j.circuitbreaker.instances.inventoryCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.inventoryCircuitBreaker.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.inventoryCircuitBreaker.permitted-number-of-calls-in-half-open-state=1
resilience4j.circuitbreaker.instances.inventoryCircuitBreaker.automatic-transition-from-open-to-half-open-enabled=true


# ==========================================
# RECOMMENDATION CIRCUIT BREAKER
# ==========================================

resilience4j.circuitbreaker.instances.recommendationCircuitBreaker.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.recommendationCircuitBreaker.sliding-window-size=5
resilience4j.circuitbreaker.instances.recommendationCircuitBreaker.minimum-number-of-calls=2
resilience4j.circuitbreaker.instances.recommendationCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.recommendationCircuitBreaker.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.recommendationCircuitBreaker.permitted-number-of-calls-in-half-open-state=1
resilience4j.circuitbreaker.instances.recommendationCircuitBreaker.automatic-transition-from-open-to-half-open-enabled=true


# ==========================================
# PRODUCT BULKHEAD
# ==========================================

resilience4j.bulkhead.instances.productBulkhead.maxConcurrentCalls=3
resilience4j.bulkhead.instances.productBulkhead.maxWaitDuration=0


# ==========================================
# PRODUCT TIME LIMITER
# ==========================================

resilience4j.timelimiter.instances.productTimeLimiter.timeoutDuration=3s
resilience4j.timelimiter.instances.productTimeLimiter.cancelRunningFuture=true